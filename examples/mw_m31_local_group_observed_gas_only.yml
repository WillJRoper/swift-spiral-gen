# Gas-rich observed-phase-space experiment. The original stellar mass is moved
# into each gas disc, preserving total disc baryonic mass but not the original
# compact stellar mass profile. This is a progenitor/formation experiment, not
# a guaranteed present-day Local Group analogue; calibrate its formation and
# relaxation interval before interpreting a merger run.
extends: mw_m31_local_group_observed.yml

output:
  ics: mw_m31_local_group_observed_gas_only.hdf5
  params: mw_m31_local_group_observed_gas_only_params.yml
  run_name: mw_m31_local_group_observed_gas_only

galaxies:
  - name: Milky Way
    masses:
      stars_msun: 0.0
      gas_msun: 7.2e10
  - name: Andromeda
    masses:
      stars_msun: 0.0
      gas_msun: 1.10e11
  - name: LMC
    masses:
      stars_msun: 0.0
      gas_msun: 3.2e9
  - name: SMC
    masses:
      stars_msun: 0.0
      gas_msun: 8.5e8
